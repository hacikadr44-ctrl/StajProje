<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Diagonal Rotor Arm Top-Left -->
  <line x1="120" y1="120" x2="256" y2="256" stroke="#334155" stroke-width="20" stroke-linecap="round"/>
  <!-- Diagonal Rotor Arm Top-Right -->
  <line x1="392" y1="120" x2="256" y2="256" stroke="#334155" stroke-width="20" stroke-linecap="round"/>
  <!-- Diagonal Rotor Arm Bottom-Left -->
  <line x1="120" y1="392" x2="256" y2="256" stroke="#334155" stroke-width="20" stroke-linecap="round"/>
  <!-- Diagonal Rotor Arm Bottom-Right -->
  <line x1="392" y1="392" x2="256" y2="256" stroke="#334155" stroke-width="20" stroke-linecap="round"/>
  <!-- Rotor Motor Guards Top-Left -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="#38BDF8" stroke-width="8"/>
  <circle cx="100" cy="100" r="16" fill="#1E293B"/>
  <ellipse cx="100" cy="100" rx="45" ry="10" fill="#44D62C" transform="rotate(35 100 100)"/>
  <!-- Rotor Motor Guards Top-Right -->
  <circle cx="412" cy="100" r="55" fill="none" stroke="#38BDF8" stroke-width="8"/>
  <circle cx="412" cy="100" r="16" fill="#1E293B"/>
  <ellipse cx="412" cy="100" rx="45" ry="10" fill="#44D62C" transform="rotate(-35 412 100)"/>
  <!-- Rotor Motor Guards Bottom-Left -->
  <circle cx="100" cy="412" r="55" fill="none" stroke="#38BDF8" stroke-width="8"/>
  <circle cx="100" cy="412" r="16" fill="#1E293B"/>
  <ellipse cx="100" cy="412" rx="45" ry="10" fill="#44D62C" transform="rotate(-35 100 412)"/>
  <!-- Rotor Motor Guards Bottom-Right -->
  <circle cx="412" cy="412" r="55" fill="none" stroke="#38BDF8" stroke-width="8"/>
  <circle cx="412" cy="412" r="16" fill="#1E293B"/>
  <ellipse cx="412" cy="412" rx="45" ry="10" fill="#44D62C" transform="rotate(35 412 412)"/>
  <!-- Central Body Fuselage -->
  <rect x="200" y="160" width="112" height="192" rx="40" ry="40" fill="#1E293B" stroke="#38BDF8" stroke-width="10"/>
  <!-- Front Camera Housing Gimbal -->
  <circle cx="256" cy="190" r="30" fill="#0284C7" stroke="#0F172A" stroke-width="4"/>
  <circle cx="256" cy="190" r="14" fill="#38BDF8"/>
  <!-- Rear LED Status Indicator -->
  <circle cx="256" cy="320" r="8" fill="#EF4444"/>
</svg>
