<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Laptop Screen Lid Back -->
  <rect x="70" y="70" width="372" height="250" rx="20" ry="20" fill="#1E293B" stroke="#38BDF8" stroke-width="10"/>
  <!-- Display Screen -->
  <rect x="88" y="88" width="336" height="214" rx="8" ry="8" fill="#0284C7"/>
  <!-- Webcam Dot -->
  <circle cx="256" cy="79" r="4" fill="#44D62C"/>
  <!-- Screen Gloss -->
  <path d="M 88 88 L 424 88 L 88 280 Z" fill="#FFFFFF" opacity="0.2"/>
  <!-- Code lines on screen -->
  <line x1="110" y1="120" x2="220" y2="120" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  <line x1="110" y1="145" x2="300" y2="145" stroke="#44D62C" stroke-width="8" stroke-linecap="round"/>
  <line x1="110" y1="170" x2="260" y2="170" stroke="#FACC15" stroke-width="8" stroke-linecap="round"/>
  <!-- Hinge -->
  <rect x="206" y="320" width="100" height="12" fill="#0F172A"/>
  <!-- Laptop Base Deck -->
  <path d="M 30 330 L 482 330 A 16 16 0 0 1 498 346 L 478 410 A 16 16 0 0 1 462 424 L 50 424 A 16 16 0 0 1 34 410 L 14 346 A 16 16 0 0 1 30 330 Z" fill="#334155" stroke="#38BDF8" stroke-width="8"/>
  <!-- Keyboard area -->
  <rect x="80" y="342" width="352" height="42" rx="6" ry="6" fill="#0F172A"/>
  <!-- Key rows indication -->
  <line x1="90" y1="353" x2="422" y2="353" stroke="#38BDF8" stroke-width="4" stroke-dasharray="16 6"/>
  <line x1="90" y1="363" x2="422" y2="363" stroke="#44D62C" stroke-width="4" stroke-dasharray="14 6"/>
  <line x1="90" y1="373" x2="422" y2="373" stroke="#38BDF8" stroke-width="4" stroke-dasharray="20 6"/>
  <!-- Trackpad -->
  <rect x="216" y="390" width="80" height="26" rx="4" ry="4" fill="#475569" stroke="#38BDF8" stroke-width="2"/>
</svg>
