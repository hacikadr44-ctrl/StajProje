<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <!-- Gradient for Main Symbol & Accent Text -->
    <linearGradient id="voltGradientFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44d62c" />
      <stop offset="60%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Background Icon Card Gradient -->
    <linearGradient id="bgIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c28" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44d62c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Drop Shadow & Glow Filters -->
    <filter id="neonGlowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- LOGO EMBLEM ICON (Left) -->
  <g transform="translate(6, 6)">
    <!-- Base Container -->
    <rect x="0" y="0" width="68" height="68" rx="18" fill="url(#bgIconGrad)" stroke="url(#borderGrad)" stroke-width="2" />

    <!-- Stylized Geometric T + Lightning Bolt -->
    <g filter="url(#neonGlowFull)" transform="translate(-4, -2) scale(0.76)">
      <!-- Top Bar of 'T' -->
      <path d="M 24 24 L 76 24 C 78 24 79 26 78 28 L 72 34 C 71 35 70 36 68 36 L 32 36 C 30 36 29 35 28 34 L 22 28 C 21 26 22 24 24 24 Z" fill="url(#voltGradientFull)" />

      <!-- Stem of 'T' & Lightning -->
      <path d="M 56 34 L 39 56 L 51 56 L 42 77 C 41 79 44 80 45 78 L 65 52 L 53 52 L 63 34 Z" fill="url(#voltGradientFull)" />
    </g>
  </g>

  <!-- TYPOGRAPHY (Right) -->
  <g transform="translate(90, 48)">
    <!-- "Tekno" in White -->
    <text font-family="'Space Grotesk', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="-0.5">Tekno</text>
    
    <!-- "Markt" in Volt Gradient -->
    <text x="102" font-family="'Space Grotesk', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="34" fill="url(#voltGradientFull)" letter-spacing="-0.5">Markt</text>
  </g>

  <!-- Subtitle Tagline / Badge -->
  <g transform="translate(92, 65)">
    <text font-family="'JetBrains Mono', 'Inter', sans-serif" font-weight="600" font-size="10" fill="#9aa0b4" letter-spacing="2.5" opacity="0.85">PREMIUM TEKNOLOJİ</text>
  </g>
</svg>
