<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Gradient for Main Lightning / T Symbol -->
    <linearGradient id="voltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44d62c" />
      <stop offset="60%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Background Card Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c28" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44d62c" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Drop Shadow & Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="2.5" />

  <!-- Inner Subtle Circuit Line Accents -->
  <path d="M 18,30 L 30,30 L 38,22" fill="none" stroke="#44d62c" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <circle cx="18" cy="30" r="2.5" fill="#44d62c" opacity="0.6" />
  
  <path d="M 82,70 L 70,70 L 62,78" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <circle cx="82" cy="70" r="2.5" fill="#2dd4bf" opacity="0.6" />

  <!-- Stylized Geometric 'T' + Lightning Bolt Icon -->
  <g filter="url(#neonGlow)">
    <!-- Top Horizontal Bar of 'T' -->
    <path d="M 22 24 L 78 24 C 80 24 81 26 80 28 L 74 34 C 73 35 72 36 70 36 L 30 36 C 28 36 27 35 26 34 L 20 28 C 19 26 20 24 22 24 Z" fill="url(#voltGradient)" />

    <!-- Lightning Bolt Vertical Shaft forming the stem of 'T' -->
    <path d="M 57 34 L 38 57 L 51 57 L 41 78 C 40 80 43 81 44 79 L 66 52 L 53 52 L 64 34 Z" fill="url(#voltGradient)" />
  </g>
</svg>
